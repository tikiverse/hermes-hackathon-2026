[project]
name = "hermes-hackathon-2026"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "hermes-agent>=0.19",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "jsonschema>=4",
    "playwright>=1.50,<2",
    "packaging>=26.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hermes: runs the real hermes CLI against each plugin"]
